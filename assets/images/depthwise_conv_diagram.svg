<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" width="880" height="380">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap');
      text { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
      .mono { font-family: 'JetBrains Mono', monospace; }
      
      @keyframes pulseFMA {
        0%, 100% { filter: drop-shadow(0 0 6px rgba(238, 111, 64, 0.4)); stroke: #ee6f40; }
        50% { filter: drop-shadow(0 0 14px rgba(238, 111, 64, 0.8)); stroke: #f28b63; }
      }
      .fma-pulse { animation: pulseFMA 3s infinite ease-in-out; }
    </style>

    <linearGradient id="dwBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f1722" />
      <stop offset="100%" stop-color="#182230" />
    </linearGradient>

    <linearGradient id="fmaGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#177272" />
      <stop offset="100%" stop-color="#ee6f40" />
    </linearGradient>
  </defs>

  <!-- Container Base -->
  <rect width="880" height="380" rx="14" fill="url(#dwBg)" stroke="#253549" stroke-width="2" />

  <!-- Top Title -->
  <g transform="translate(30, 24)">
    <rect width="820" height="42" rx="8" fill="#16202e" stroke="#253549" />
    <circle cx="22" cy="21" r="5" fill="#ee6f40" />
    <circle cx="38" cy="21" r="5" fill="#177272" />
    <circle cx="54" cy="21" r="5" fill="#34d399" />
    <text x="75" y="26" fill="#f8fafc" font-size="13" font-weight="700" letter-spacing="0.5">
      EMBEDDED AI — DEPTHWISE 2D CONVOLUTION AUTO-VECTORIZED VIA DLI
    </text>
    <rect x="675" y="10" width="130" height="22" rx="11" fill="#177272" fill-opacity="0.3" stroke="#177272" />
    <text x="740" y="25" fill="#5eead4" font-size="10.5" font-weight="700" text-anchor="middle">212.3 GFLOPS (CPU)</text>
  </g>

  <!-- Main Pipeline Flow -->
  <g transform="translate(30, 85)">
    <!-- 1. Input Tensor Channels (x=0) -->
    <g transform="translate(0, 0)">
      <rect width="210" height="200" rx="10" fill="#131d2b" stroke="#177272" stroke-width="1.5" />
      <rect width="210" height="28" rx="10" fill="#177272" fill-opacity="0.3" />
      <text x="105" y="19" fill="#5eead4" font-size="11" font-weight="700" text-anchor="middle">
        Input Channels (H × W × C)
      </text>

      <!-- 4 Layered Channel Slices -->
      <g transform="translate(20, 48)">
        <!-- Channel 3 -->
        <rect x="30" y="0" width="130" height="70" rx="5" fill="#6b21a8" fill-opacity="0.4" stroke="#c084fc" stroke-dasharray="3,3" />
        <text x="95" y="20" fill="#c084fc" font-size="10" text-anchor="middle">Channel 3 (s=3)</text>
        <!-- Channel 2 -->
        <rect x="20" y="15" width="130" height="70" rx="5" fill="#d97706" fill-opacity="0.4" stroke="#fbbf24" stroke-dasharray="3,3" />
        <text x="85" y="35" fill="#fbbf24" font-size="10" text-anchor="middle">Channel 2 (s=2)</text>
        <!-- Channel 1 -->
        <rect x="10" y="30" width="130" height="70" rx="5" fill="#059669" fill-opacity="0.4" stroke="#34d399" stroke-dasharray="3,3" />
        <text x="75" y="50" fill="#34d399" font-size="10" text-anchor="middle">Channel 1 (s=1)</text>
        <!-- Channel 0 -->
        <rect x="0" y="45" width="130" height="70" rx="5" fill="#0284c7" fill-opacity="0.6" stroke="#38bdf8" />
        <text x="65" y="65" fill="#fff" font-size="11" font-weight="700" text-anchor="middle">Channel 0 (s=0)</text>
        <!-- 3x3 receptive field patch -->
        <rect x="30" y="70" width="30" height="30" rx="3" fill="#ee6f40" fill-opacity="0.6" stroke="#ee6f40" stroke-width="1.5" />
        <text x="45" y="90" fill="#fff" font-size="9" font-weight="700" text-anchor="middle" class="mono">3×3</text>
      </g>
      <text x="105" y="185" fill="#94a3b8" font-size="10" text-anchor="middle">No Inter-Channel Mixing</text>
    </g>

    <!-- Arrow 1 -->
    <path d="M 225,100 L 255,100" stroke="#5eead4" stroke-width="2.5" marker-end="url(#arrow)" />
    <text x="240" y="90" fill="#5eead4" font-size="16" font-weight="800" text-anchor="middle">→</text>

    <!-- 2. Legolas DLI Interleaving & SIMD FMA (x=270) -->
    <g transform="translate(270, 0)">
      <rect class="fma-pulse" width="280" height="200" rx="10" fill="#16202e" stroke="#ee6f40" stroke-width="2" />
      <rect width="280" height="28" rx="10" fill="#ee6f40" fill-opacity="0.2" />
      <text x="140" y="19" fill="#fca5a5" font-size="11" font-weight="800" text-anchor="middle">
        Legolas++ Hardware SIMD FMA
      </text>

      <!-- Interleaved 4-Channel Vector Packet -->
      <g transform="translate(20, 45)">
        <text x="120" y="15" fill="#cbd5e1" font-size="10.5" font-weight="600" text-anchor="middle">
          Contiguous Interleaved Pixel Vector:
        </text>
        <!-- Packed Vector -->
        <g transform="translate(10, 25)">
          <rect x="0" width="52" height="32" rx="4" fill="#0284c7" /><text x="26" y="21" fill="#fff" font-size="11" font-weight="700" text-anchor="middle" class="mono">Ch 0</text>
          <rect x="56" width="52" height="32" rx="4" fill="#059669" /><text x="82" y="21" fill="#fff" font-size="11" font-weight="700" text-anchor="middle" class="mono">Ch 1</text>
          <rect x="112" width="52" height="32" rx="4" fill="#d97706" /><text x="138" y="21" fill="#fff" font-size="11" font-weight="700" text-anchor="middle" class="mono">Ch 2</text>
          <rect x="168" width="52" height="32" rx="4" fill="#9333ea" /><text x="194" y="21" fill="#fff" font-size="11" font-weight="700" text-anchor="middle" class="mono">Ch 3</text>
        </g>
        
        <!-- FMA Instruction Box -->
        <g transform="translate(10, 75)">
          <rect width="220" height="42" rx="6" fill="url(#fmaGrad)" stroke="#ee6f40" />
          <text x="110" y="18" fill="#fff" font-size="10.5" font-weight="800" text-anchor="middle">
            1 Instruction (NEON fmla.4s)
          </text>
          <text x="110" y="34" fill="#fef3c7" font-size="9.5" font-weight="600" text-anchor="middle" class="mono">
            4 Convolutions Computed in 1 Cycle
          </text>
        </g>
      </g>
      <text x="140" y="185" fill="#34d399" font-size="10" font-weight="700" text-anchor="middle">
        ✓ 5.83× Speedup vs Compiler Auto-Vectorization
      </text>
    </g>

    <!-- Arrow 2 -->
    <text x="565" y="105" fill="#ee6f40" font-size="16" font-weight="800" text-anchor="middle">→</text>

    <!-- 3. Output Feature Maps (x=610) -->
    <g transform="translate(610, 0)">
      <rect width="210" height="200" rx="10" fill="#131d2b" stroke="#34d399" stroke-width="1.5" />
      <rect width="210" height="28" rx="10" fill="#34d399" fill-opacity="0.25" />
      <text x="105" y="19" fill="#6ee7b7" font-size="11" font-weight="700" text-anchor="middle">
        Filtered Output Maps
      </text>

      <g transform="translate(20, 48)">
        <rect x="30" y="0" width="130" height="70" rx="5" fill="#6b21a8" fill-opacity="0.3" stroke="#c084fc" stroke-dasharray="3,3" />
        <rect x="20" y="15" width="130" height="70" rx="5" fill="#d97706" fill-opacity="0.3" stroke="#fbbf24" stroke-dasharray="3,3" />
        <rect x="10" y="30" width="130" height="70" rx="5" fill="#059669" fill-opacity="0.3" stroke="#34d399" stroke-dasharray="3,3" />
        <rect x="0" y="45" width="130" height="70" rx="5" fill="#0284c7" fill-opacity="0.5" stroke="#38bdf8" />
        <text x="65" y="85" fill="#fff" font-size="11" font-weight="700" text-anchor="middle">4× Channels Out</text>
      </g>
      <text x="105" y="185" fill="#5eead4" font-size="10" font-weight="700" text-anchor="middle">
        Exact Match: Error = 0.00
      </text>
    </g>
  </g>

  <!-- Bottom Metric Badges -->
  <g transform="translate(30, 310)">
    <rect width="820" height="46" rx="8" fill="#16202e" stroke="#253549" />
    <text x="40" y="28" fill="#ee6f40" font-size="12" font-weight="800">7.08 GFLOPS / WATT</text>
    <text x="210" y="28" fill="#94a3b8" font-size="11">Embedded CPU Efficiency</text>
    <text x="390" y="28" fill="#5eead4" font-size="12" font-weight="800">ZERO PCIE TRANSFERS</text>
    <text x="565" y="28" fill="#94a3b8" font-size="11">No External GPU Wakeup Lag</text>
    <text x="730" y="28" fill="#34d399" font-size="12" font-weight="800">-82.8% POWER</text>
  </g>
</svg>
