<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Background Dark Squircle -->
  <rect width="128" height="128" rx="28" fill="#0f1722" stroke="#1e293b" stroke-width="2" />

  <g transform="translate(8, 12)">
    <!-- Top Lane (Teal straight bar) -->
    <path d="M 14,46 L 52,46" fill="none" stroke="#177272" stroke-width="6" stroke-linecap="round" />

    <!-- Upper Orange/Coral Chevron -->
    <path d="M 54,48 L 71,31 L 61,22" fill="none" stroke="#ee6f40" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Lane 2 (Teal curving into arrow) -->
    <path d="M 14,58 L 54,58 C 63,58 70,52 76,46 L 87,35" fill="none" stroke="#1a8080" stroke-width="6" stroke-linecap="round" />

    <!-- Lane 3 (Teal curving into arrow) -->
    <path d="M 14,70 L 56,70 C 66,70 75,63 83,55 L 94,44" fill="none" stroke="#1f9393" stroke-width="6" stroke-linecap="round" />

    <!-- Lane 4 (Bottom Teal curve) -->
    <path d="M 14,82 L 58,82 C 70,82 80,74 89,65 L 98,56" fill="none" stroke="#26a5a5" stroke-width="6" stroke-linecap="round" />

    <!-- Lower Orange/Coral Chevron -->
    <path d="M 74,83 L 90,67 L 97,74" fill="none" stroke="#ee6f40" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Big Mint Green Arrowhead (Facing 45 deg Up-Right) -->
    <polygon points="98,12 66,24 78,32 86,44" fill="#34d399" stroke="#34d399" stroke-width="1.5" stroke-linejoin="round" />
    <!-- Inner dark teal accent notch -->
    <polygon points="82,28 75,30 78,32 80,35" fill="#177272" />
  </g>
</svg>
