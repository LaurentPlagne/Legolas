<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 110" width="540" height="110">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@700;800;900&amp;family=JetBrains+Mono:wght@600&amp;display=swap');
      .brand-title-dark { font-family: 'Outfit', -apple-system, sans-serif; font-weight: 800; font-size: 38px; fill: #f8fafc; letter-spacing: -0.5px; }
      .brand-plus-dark { font-family: 'Outfit', -apple-system, sans-serif; font-weight: 900; font-size: 42px; fill: #ee6f40; }
      .brand-sub-dark { font-family: 'Outfit', -apple-system, sans-serif; font-weight: 700; font-size: 10px; fill: #5eead4; letter-spacing: 2px; text-transform: uppercase; }
      .brand-mono-dark { font-family: 'JetBrains Mono', monospace; font-size: 9px; fill: #94a3b8; font-weight: 600; }
    </style>
  </defs>

  <!-- EMBLEM: Option 3 Cyber Bow & 4-Lane SIMD Vector Arrow (Dark Mode) -->
  <g transform="translate(15, 8)">
    <!-- Bowstring & Nock Region -->
    <path d="M 34,8 L 52,47 L 34,86" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="52" cy="47" r="4" fill="#ee6f40" />

    <!-- Cyber Recurve Bow (Teal with Mint Accents) -->
    <path d="M 36,6 C 22,14 12,28 12,47 C 12,66 22,80 36,88 C 31,81 20,68 20,47 C 20,26 31,13 36,6 Z" 
          fill="#177272" stroke="#5eead4" stroke-width="1.5" />
    
    <!-- Bow Limb Energy Tips -->
    <polygon points="36,6 42,3 39,11" fill="#5eead4" />
    <polygon points="36,88 42,91 39,83" fill="#5eead4" />
    <circle cx="20" cy="47" r="4.5" fill="#ee6f40" stroke="#5eead4" stroke-width="1.5" />

    <!-- 4 SOLID SIMD Vector Lanes (Glowing in Dark Mode) -->
    <!-- Lane 0 (Upper SIMD Track, Bright Mint) -->
    <g>
      <rect x="46" y="30" width="46" height="4" rx="2" fill="#5eead4" />
      <polygon points="92,32 98,38 95,40 89,34" fill="#5eead4" />
    </g>

    <!-- Lane 1 (Mid-Upper Track, Peach Coral) -->
    <rect x="54" y="40" width="48" height="4.5" rx="2" fill="#fb923c" />

    <!-- Lane 2 (Mid-Lower Track, Warm Coral) -->
    <rect x="54" y="50" width="48" height="4.5" rx="2" fill="#ee6f40" />

    <!-- Lane 3 (Lower SIMD Track, Bright Emerald) -->
    <g>
      <rect x="46" y="60" width="46" height="4" rx="2" fill="#34d399" />
      <polygon points="92,62 98,56 95,54 89,60" fill="#34d399" />
    </g>

    <!-- Central Supersonic Vector Arrowhead -->
    <!-- Main Arrowhead Wings -->
    <polygon points="126,47 96,33 103,47 96,61" fill="#ee6f40" stroke="#f28b63" stroke-width="1.5" />
    <!-- Core Diamond Pivot -->
    <polygon points="122,47 110,43 104,47 110,51" fill="#ffffff" />
    <!-- Center Pivot Node -->
    <circle cx="104" cy="47" r="2.2" fill="#5eead4" />
  </g>

  <!-- TYPOGRAPHY & BRANDING (Dark Mode: White / Mint / Coral) -->
  <g transform="translate(160, 20)">
    <!-- Main Title: Legolas++ -->
    <text x="0" y="42" class="brand-title-dark">Legolas<tspan class="brand-plus-dark">++</tspan></text>
    
    <!-- Subtitle: SIMD Tensor & DLI Engine -->
    <text x="2" y="64" class="brand-sub-dark">DATA LAYOUT INTERLEAVING • SIMD TENSOR ENGINE</text>

    <!-- Technical Tagline -->
    <text x="2" y="78" class="brand-mono-dark">C++14/20 // PURE HEADER-ONLY // MIT LICENSE</text>
  </g>
</svg>
