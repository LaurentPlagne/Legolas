<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 560" width="100%" height="100%" style="background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Background & Card Gradients -->
    <linearGradient id="codeBoxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="engineGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f766e" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>
    <linearGradient id="simdGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95" />
    </linearGradient>
    <linearGradient id="multiGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95" />
    </linearGradient>
    <linearGradient id="gpuGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7c2d12" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95" />
    </linearGradient>

    <!-- Arrow Marker -->
    <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#14b8a6" />
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#38bdf8" />
    </marker>
    <marker id="arrow-emerald" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#34d399" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#fb923c" />
    </marker>

    <!-- Drop Shadow -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- ================================================================= -->
  <!-- 1. TOP BOX: 1 Single Simple & Readable Code                       -->
  <!-- ================================================================= -->
  <g transform="translate(145, 20)">
    <rect x="0" y="0" width="650" height="140" rx="14" fill="url(#codeBoxGrad)" stroke="#38bdf8" stroke-width="2" filter="url(#shadow)" />
    
    <!-- Title Badge -->
    <rect x="195" y="-14" width="260" height="28" rx="14" fill="#0284c7" stroke="#38bdf8" stroke-width="1.5" />
    <text x="325" y="5" fill="#ffffff" font-size="12" font-weight="800" text-anchor="middle" letter-spacing="1">1 SINGLE NATURAL SCALAR CODE</text>
    
    <!-- Code Snippet -->
    <g transform="translate(25, 30)" font-family="'JetBrains Mono', 'Fira Code', 'Courier New', monospace" font-size="13">
      <text x="0" y="18" fill="#94a3b8">// Write natural numerical solver once (simple sequential math):</text>
      <text x="0" y="38" fill="#c084fc">template</text>
      <text x="70" y="38" fill="#e2e8f0">&lt;</text>
      <text x="80" y="38" fill="#f43f5e">class</text>
      <text x="125" y="38" fill="#fbbf24">A2D</text>
      <text x="150" y="38" fill="#e2e8f0">&gt; <tspan fill="#60a5fa">void</tspan> <tspan fill="#34d399">solve</tspan>(<tspan fill="#fbbf24">A2D</tspan> X, <tspan fill="#fbbf24">A2D</tspan> Y) {</text>
      <text x="20" y="60" fill="#c084fc">for</text>
      <text x="50" y="60" fill="#e2e8f0">(<tspan fill="#60a5fa">int</tspan> i = 0; i &lt; N; ++i) {</text>
      <text x="40" y="82" fill="#e2e8f0">Y[i] = A * X[i] + B * Y[i - 1];  <tspan fill="#6ee7b7" font-style="italic">// Natural math, ZERO intrinsics!</tspan></text>
      <text x="20" y="100" fill="#e2e8f0">}</text>
    </g>
  </g>

  <!-- Central Connecting Arrow -->
  <line x1="470" y1="160" x2="470" y2="198" stroke="#14b8a6" stroke-width="3" marker-end="url(#arrow)" />

  <!-- ================================================================= -->
  <!-- 2. MIDDLE BOX: Legolas++ DLI Tensor Engine                        -->
  <!-- ================================================================= -->
  <g transform="translate(255, 202)">
    <rect x="0" y="0" width="430" height="46" rx="23" fill="url(#engineGrad)" stroke="#2dd4bf" stroke-width="2" filter="url(#shadow)" />
    <text x="215" y="28" fill="#ffffff" font-size="14" font-weight="800" text-anchor="middle" letter-spacing="0.5">⚡ Legolas++ DLI Engine (Data Layout Interleaving)</text>
  </g>

  <!-- Branching Arrows from Engine to the 3 Targets -->
  <path d="M 330 248 L 330 280 L 160 280 L 160 300" fill="none" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrow-blue)" />
  <path d="M 470 248 L 470 300" fill="none" stroke="#34d399" stroke-width="2.5" marker-end="url(#arrow-emerald)" />
  <path d="M 610 248 L 610 280 L 780 280 L 780 300" fill="none" stroke="#fb923c" stroke-width="2.5" marker-end="url(#arrow-orange)" />

  <!-- ================================================================= -->
  <!-- 3. BOTTOM TARGET CARDS                                            -->
  <!-- ================================================================= -->

  <!-- TARGET 1: CPU SIMD -->
  <g transform="translate(25, 305)">
    <rect x="0" y="0" width="275" height="235" rx="14" fill="url(#simdGrad)" stroke="#0284c7" stroke-width="2" filter="url(#shadow)" />
    
    <!-- Card Header -->
    <rect x="0" y="0" width="275" height="44" rx="14" fill="#0369a1" />
    <rect x="0" y="30" width="275" height="14" fill="#0369a1" />
    <text x="137" y="28" fill="#ffffff" font-size="14" font-weight="700" text-anchor="middle">⚡ CPU SIMD Vectorized</text>
    
    <!-- Content List -->
    <g transform="translate(18, 68)" font-size="12" fill="#e2e8f0" line-height="1.5">
      <circle cx="6" cy="6" r="4" fill="#38bdf8" />
      <text x="18" y="10" font-weight="700" fill="#38bdf8">ARM NEON</text>
      <text x="18" y="26" fill="#cbd5e1">4 floats / 128-bit vector lanes</text>
      
      <circle cx="6" cy="50" r="4" fill="#38bdf8" />
      <text x="18" y="54" font-weight="700" fill="#38bdf8">x86 AVX2</text>
      <text x="18" y="70" fill="#cbd5e1">8 floats / 256-bit vector lanes</text>
      
      <circle cx="6" cy="94" r="4" fill="#38bdf8" />
      <text x="18" y="98" font-weight="700" fill="#38bdf8">x86 AVX-512</text>
      <text x="18" y="114" fill="#cbd5e1">16 floats / 512-bit vector lanes</text>

      <rect x="0" y="132" width="239" height="26" rx="6" fill="#0c4a6e" />
      <text x="119" y="149" fill="#7dd3fc" font-size="11" font-weight="700" text-anchor="middle">100% Peak SIMD Line-Rate</text>
    </g>
  </g>

  <!-- TARGET 2: CPU MULTI-CORE -->
  <g transform="translate(332, 305)">
    <rect x="0" y="0" width="275" height="235" rx="14" fill="url(#multiGrad)" stroke="#059669" stroke-width="2" filter="url(#shadow)" />
    
    <!-- Card Header -->
    <rect x="0" y="0" width="275" height="44" rx="14" fill="#047857" />
    <rect x="0" y="30" width="275" height="14" fill="#047857" />
    <text x="137" y="28" fill="#ffffff" font-size="14" font-weight="700" text-anchor="middle">🚀 Multi-Core Parallel</text>
    
    <!-- Content List -->
    <g transform="translate(18, 68)" font-size="12" fill="#e2e8f0">
      <circle cx="6" cy="6" r="4" fill="#34d399" />
      <text x="18" y="10" font-weight="700" fill="#34d399">StaticThreadPool</text>
      <text x="18" y="26" fill="#cbd5e1">Hybrid spin-then-sleep scheduler</text>
      
      <circle cx="6" cy="50" r="4" fill="#34d399" />
      <text x="18" y="54" font-weight="700" fill="#34d399">Full Core Scaling</text>
      <text x="18" y="70" fill="#cbd5e1">Scales cleanly from 4 to 128+ threads</text>
      
      <circle cx="6" cy="94" r="4" fill="#34d399" />
      <text x="18" y="98" font-weight="700" fill="#34d399">Nested Re-entrancy</text>
      <text x="18" y="114" fill="#cbd5e1">Safe inline execution of nested loops</text>

      <rect x="0" y="132" width="239" height="26" rx="6" fill="#064e3b" />
      <text x="119" y="149" fill="#a7f3d0" font-size="11" font-weight="700" text-anchor="middle">SIMD Active on Every Thread</text>
    </g>
  </g>

  <!-- TARGET 3: GPU ACCELERATION -->
  <g transform="translate(640, 305)">
    <rect x="0" y="0" width="275" height="235" rx="14" fill="url(#gpuGrad)" stroke="#d97706" stroke-width="2" filter="url(#shadow)" />
    
    <!-- Card Header -->
    <rect x="0" y="0" width="275" height="44" rx="14" fill="#b45309" />
    <rect x="0" y="30" width="275" height="14" fill="#b45309" />
    <text x="137" y="28" fill="#ffffff" font-size="14" font-weight="700" text-anchor="middle">🔥 GPU Acceleration</text>
    
    <!-- Content List -->
    <g transform="translate(18, 68)" font-size="12" fill="#e2e8f0">
      <circle cx="6" cy="6" r="4" fill="#fb923c" />
      <text x="18" y="10" font-weight="700" fill="#fb923c">Vulkan Compute</text>
      <text x="18" y="26" fill="#cbd5e1">Linux &amp; Windows (zero-dependency)</text>
      
      <circle cx="6" cy="50" r="4" fill="#fb923c" />
      <text x="18" y="54" font-weight="700" fill="#fb923c">Apple Metal</text>
      <text x="18" y="70" fill="#cbd5e1">Native macOS Unified Memory (UMA)</text>
      
      <circle cx="6" cy="94" r="4" fill="#fb923c" />
      <text x="18" y="98" font-weight="700" fill="#fb923c">100% Warp Coalescing</text>
      <text x="18" y="114" fill="#cbd5e1">vec4 ILP + Blocked Prefix Scan</text>

      <rect x="0" y="132" width="239" height="26" rx="6" fill="#78350f" />
      <text x="119" y="149" fill="#fed7aa" font-size="11" font-weight="700" text-anchor="middle">Up to 58x on Resident Data</text>
    </g>
  </g>
</svg>
