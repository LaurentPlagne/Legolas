<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 110" width="540" height="110">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@700;800;900&amp;family=JetBrains+Mono:wght@600&amp;display=swap');
      .brand-title-light { font-family: 'Outfit', -apple-system, sans-serif; font-weight: 800; font-size: 40px; fill: #0f1722; letter-spacing: -0.5px; }
      .brand-plus-light { font-family: 'Outfit', -apple-system, sans-serif; font-weight: 900; font-size: 44px; fill: #ee6f40; }
      .brand-sub-light { font-family: 'Outfit', -apple-system, sans-serif; font-weight: 700; font-size: 10.5px; fill: #177272; letter-spacing: 2px; text-transform: uppercase; }
      .brand-mono-light { font-family: 'JetBrains Mono', monospace; font-size: 9.5px; fill: #475569; font-weight: 600; }
    </style>

    <linearGradient id="logoArrowGradLight" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#ee6f40" />
      <stop offset="50%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <linearGradient id="logoLane0Light" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0e4b4b" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <linearGradient id="logoLane1Light" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0e4b4b" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>

    <linearGradient id="logoLane2Light" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>

    <linearGradient id="logoLane3Light" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#ee6f40" />
    </linearGradient>
  </defs>

  <!-- EMBLEM: Option 1 Matrix Stream & SIMD Vector Arrow (Light Mode) -->
  <g transform="translate(10, 4) scale(0.92)">
    <!-- Container -->
    <rect x="4" y="4" width="112" height="112" rx="24" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" />

    <!-- Matrix Memory Blocks & SIMD Streaming Lanes -->
    <!-- Lane 0 -->
    <rect x="16" y="42" width="7" height="4.5" rx="1.5" fill="#0e4b4b" opacity="0.8" />
    <rect x="25" y="42" width="10" height="4.5" rx="1.5" fill="#059669" opacity="0.95" />
    <path d="M 37,44.25 L 48,44.25 C 58,44.25 66,40 72,32 L 78,26" fill="none" stroke="url(#logoLane0Light)" stroke-width="4" stroke-linecap="round" />

    <!-- Lane 1 -->
    <rect x="16" y="53" width="10" height="4.5" rx="1.5" fill="#0e4b4b" opacity="0.75" />
    <rect x="29" y="53" width="8" height="4.5" rx="1.5" fill="#0d9488" opacity="0.95" />
    <path d="M 39,55.25 L 52,55.25 C 63,55.25 72,49 79,40 L 85,33" fill="none" stroke="url(#logoLane1Light)" stroke-width="4" stroke-linecap="round" />

    <!-- Lane 2 -->
    <rect x="16" y="64" width="7" height="4.5" rx="1.5" fill="#0d9488" opacity="0.75" />
    <rect x="26" y="64" width="12" height="4.5" rx="1.5" fill="#ea580c" opacity="0.95" />
    <path d="M 40,66.25 L 56,66.25 C 68,66.25 78,58 86,48 L 92,41" fill="none" stroke="url(#logoLane2Light)" stroke-width="4" stroke-linecap="round" />

    <!-- Lane 3 -->
    <rect x="16" y="75" width="12" height="4.5" rx="1.5" fill="#ea580c" opacity="0.75" />
    <rect x="31" y="75" width="8" height="4.5" rx="1.5" fill="#ee6f40" opacity="0.95" />
    <path d="M 41,77.25 L 60,77.25 C 74,77.25 85,67 93,56 L 98,49" fill="none" stroke="url(#logoLane3Light)" stroke-width="4" stroke-linecap="round" />

    <!-- Supersonic Vector Arrowhead -->
    <polygon points="110,12 72,25 89,33 97,51" fill="url(#logoArrowGradLight)" stroke="#0f1722" stroke-width="0.8" stroke-linejoin="round" />
    <polygon points="106,16 83,26 90,31 95,40" fill="#ffffff" opacity="0.9" />
    <circle cx="89" cy="33" r="2.2" fill="#059669" />

    <!-- C++ Plus Pluses -->
    <g transform="translate(16, 18)">
      <line x1="5" y1="2" x2="5" y2="10" stroke="#059669" stroke-width="2.5" stroke-linecap="round" />
      <line x1="1" y1="6" x2="9" y2="6" stroke="#059669" stroke-width="2.5" stroke-linecap="round" />
      <line x1="15" y1="2" x2="15" y2="10" stroke="#ee6f40" stroke-width="2.5" stroke-linecap="round" />
      <line x1="11" y1="6" x2="19" y2="6" stroke="#ee6f40" stroke-width="2.5" stroke-linecap="round" />
    </g>
  </g>

  <!-- TYPOGRAPHY & BRANDING (Light Mode: Slate / Deep Teal / Coral) -->
  <g transform="translate(145, 22)">
    <text x="0" y="38" class="brand-title-light">Legolas<tspan class="brand-plus-light">++</tspan></text>
    <text x="2" y="60" class="brand-sub-light">DATA LAYOUT INTERLEAVING • SIMD TENSOR ENGINE</text>
    <text x="2" y="76" class="brand-mono-light">C++14/20 // PURE HEADER-ONLY // MIT LICENSE</text>
  </g>
</svg>
