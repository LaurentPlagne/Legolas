<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 110" width="460" height="110">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@700;800;900&amp;family=JetBrains+Mono:wght@600&amp;display=swap');
      .brand-title { font-family: 'Outfit', -apple-system, sans-serif; font-weight: 800; font-size: 38px; fill: #f8fafc; letter-spacing: -0.5px; }
      .brand-plus { font-family: 'Outfit', -apple-system, sans-serif; font-weight: 900; font-size: 42px; fill: #ee6f40; }
      .brand-sub { font-family: 'Outfit', -apple-system, sans-serif; font-weight: 600; font-size: 11.5px; fill: #5eead4; letter-spacing: 2px; text-transform: uppercase; }
    </style>

    <linearGradient id="logoTeal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#229999" />
      <stop offset="100%" stop-color="#177272" />
    </linearGradient>

    <linearGradient id="logoCoral" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f28b63" />
      <stop offset="100%" stop-color="#ee6f40" />
    </linearGradient>

    <linearGradient id="logoArrow" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#ee6f40" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#5eead4" />
    </linearGradient>

    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- ICON EMBLEM (Left: x=10 to 95) -->
  <g transform="translate(12, 10)">
    <!-- Elven Bow Arch (Teal) -->
    <path d="M 22,8 Q 5,45 22,82 Q 35,45 22,8" fill="none" stroke="url(#logoTeal)" stroke-width="4.5" stroke-linecap="round" />
    <path d="M 22,8 L 48,45 L 22,82" fill="none" stroke="#253549" stroke-width="1.5" stroke-dasharray="3,3" />

    <!-- Isometric Interlocking Tensor Cubes (Lego / Tensor Packing) -->
    <!-- Cube 1 (Base, Deep Teal) -->
    <g transform="translate(32, 42)">
      <!-- Top Face -->
      <polygon points="14,0 28,7 14,14 0,7" fill="#229999" />
      <!-- Left Face -->
      <polygon points="0,7 14,14 14,28 0,21" fill="#177272" />
      <!-- Right Face -->
      <polygon points="14,14 28,7 28,21 14,28" fill="#0e4b4b" />
    </g>

    <!-- Cube 2 (Top Left, Coral Accent) -->
    <g transform="translate(18, 28)">
      <polygon points="14,0 28,7 14,14 0,7" fill="#f28b63" />
      <polygon points="0,7 14,14 14,28 0,21" fill="#ee6f40" />
      <polygon points="14,14 28,7 28,21 14,28" fill="#c2410c" />
    </g>

    <!-- Cube 3 (Right, Mint Accent) -->
    <g transform="translate(46, 28)">
      <polygon points="14,0 28,7 14,14 0,7" fill="#5eead4" />
      <polygon points="0,7 14,14 14,28 0,21" fill="#14b8a6" />
      <polygon points="14,14 28,7 28,21 14,28" fill="#0f766e" />
    </g>

    <!-- Swift SIMD Vector Arrow (Diagonal 4-lane stream crossing the tensor) -->
    <!-- 4 Vector Stream Tails -->
    <line x1="8" y1="80" x2="28" y2="60" stroke="#ee6f40" stroke-width="1.8" opacity="0.6" />
    <line x1="14" y1="84" x2="34" y2="64" stroke="#f28b63" stroke-width="1.8" opacity="0.8" />
    <line x1="20" y1="88" x2="40" y2="68" stroke="#5eead4" stroke-width="1.8" opacity="0.9" />
    <line x1="26" y1="92" x2="46" y2="72" stroke="#229999" stroke-width="1.8" />

    <!-- Main Piercing Arrow Shaft -->
    <line x1="18" y1="72" x2="72" y2="18" stroke="url(#logoArrow)" stroke-width="4.5" stroke-linecap="round" filter="url(#logoGlow)" />
    <!-- Arrow Head -->
    <polygon points="78,12 60,18 72,30" fill="#5eead4" filter="url(#logoGlow)" />
  </g>

  <!-- TYPOGRAPHY (Right: x=115 to 450) -->
  <g transform="translate(112, 0)">
    <!-- Main Name -->
    <text x="0" y="62" class="brand-title">
      LEGOLAS<tspan class="brand-plus">++</tspan>
    </text>

    <!-- Subtitle / Tagline -->
    <text x="2" y="86" class="brand-sub">
      TENSOR SIMD ENGINE · TRISCALE INNOV
    </text>
  </g>
</svg>
