<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 110" width="540" height="110">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@700;800;900&amp;family=JetBrains+Mono:wght@600&amp;display=swap');
      
      /* DEFAULT: LIGHT MODE */
      .brand-title { font-family: 'Outfit', -apple-system, sans-serif; font-weight: 800; font-size: 38px; fill: #0f172a; letter-spacing: -0.5px; }
      .brand-plus { font-family: 'Outfit', -apple-system, sans-serif; font-weight: 900; font-size: 42px; fill: #ee6f40; }
      .brand-sub { font-family: 'Outfit', -apple-system, sans-serif; font-weight: 700; font-size: 10px; fill: #0e5e5e; letter-spacing: 2px; text-transform: uppercase; }
      .brand-mono { font-family: 'JetBrains Mono', monospace; font-size: 9px; fill: #64748b; font-weight: 600; }
      .bow-shape { fill: #177272; stroke: #0e4b4b; stroke-width: 1.5; }
      .bow-tip { fill: #0d9488; }
      .bow-string { stroke: #64748b; stroke-width: 2; }
      .bow-node { fill: #ee6f40; stroke: #0e4b4b; stroke-width: 1.5; }
      .lane-0 { fill: #0d9488; }
      .lane-1 { fill: #ea580c; }
      .lane-2 { fill: #ee6f40; }
      .lane-3 { fill: #047857; }
      .arrow-wings { fill: #ee6f40; stroke: #c2410c; stroke-width: 1.5; }
      .arrow-pivot { fill: #0d9488; }

      /* AUTOMATIC ADAPTATION: DARK MODE */
      @media (prefers-color-scheme: dark) {
        .brand-title { fill: #f8fafc; }
        .brand-sub { fill: #5eead4; }
        .brand-mono { fill: #94a3b8; }
        .bow-shape { fill: #177272; stroke: #5eead4; stroke-width: 1.5; }
        .bow-tip { fill: #5eead4; }
        .bow-string { stroke: #64748b; }
        .bow-node { fill: #ee6f40; stroke: #5eead4; }
        .lane-0 { fill: #5eead4; }
        .lane-1 { fill: #fb923c; }
        .lane-2 { fill: #ee6f40; }
        .lane-3 { fill: #34d399; }
        .arrow-wings { fill: #ee6f40; stroke: #f28b63; }
        .arrow-pivot { fill: #5eead4; }
      }
    </style>
  </defs>

  <!-- EMBLEM: Option 3 Cyber Bow & 4-Lane SIMD Vector Arrow -->
  <g transform="translate(15, 8)">
    <!-- Bowstring & Nock Region -->
    <path d="M 34,8 L 52,47 L 34,86" fill="none" class="bow-string" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="52" cy="47" r="4" fill="#ee6f40" />

    <!-- Cyber Recurve Bow -->
    <path d="M 36,6 C 22,14 12,28 12,47 C 12,66 22,80 36,88 C 31,81 20,68 20,47 C 20,26 31,13 36,6 Z" 
          class="bow-shape" />
    
    <!-- Bow Limb Energy Tips -->
    <polygon points="36,6 42,3 39,11" class="bow-tip" />
    <polygon points="36,88 42,91 39,83" class="bow-tip" />
    <circle cx="20" cy="47" r="4.5" class="bow-node" />

    <!-- 4 SOLID SIMD Vector Lanes -->
    <!-- Lane 0 (Upper Track) -->
    <g>
      <rect x="46" y="30" width="46" height="4" rx="2" class="lane-0" />
      <polygon points="92,32 98,38 95,40 89,34" class="lane-0" />
    </g>

    <!-- Lane 1 (Mid-Upper Track) -->
    <rect x="54" y="40" width="48" height="4.5" rx="2" class="lane-1" />

    <!-- Lane 2 (Mid-Lower Track) -->
    <rect x="54" y="50" width="48" height="4.5" rx="2" class="lane-2" />

    <!-- Lane 3 (Lower Track) -->
    <g>
      <rect x="46" y="60" width="46" height="4" rx="2" class="lane-3" />
      <polygon points="92,62 98,56 95,54 89,60" class="lane-3" />
    </g>

    <!-- Central Supersonic Vector Arrowhead -->
    <polygon points="126,47 96,33 103,47 96,61" class="arrow-wings" />
    <!-- Core Diamond Pivot -->
    <polygon points="122,47 110,43 104,47 110,51" fill="#ffffff" />
    <!-- Center Pivot Node -->
    <circle cx="104" cy="47" r="2.2" class="arrow-pivot" />
  </g>

  <!-- TYPOGRAPHY & BRANDING -->
  <g transform="translate(160, 20)">
    <!-- Main Title: Legolas++ -->
    <text x="0" y="42" class="brand-title">Legolas<tspan class="brand-plus">++</tspan></text>
    
    <!-- Subtitle: SIMD Tensor & DLI Engine -->
    <text x="2" y="64" class="brand-sub">DATA LAYOUT INTERLEAVING • SIMD TENSOR ENGINE</text>

    <!-- Technical Tagline -->
    <text x="2" y="78" class="brand-mono">C++14/20 // PURE HEADER-ONLY // MIT LICENSE</text>
  </g>
</svg>
