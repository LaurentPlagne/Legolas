<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Background Gradient: Deep Slate -->
    <linearGradient id="iconBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#16202e" />
      <stop offset="100%" stop-color="#0b121c" />
    </linearGradient>

    <!-- Bow Gradient: TriScale Teal -->
    <linearGradient id="iconBow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#28a3a3" />
      <stop offset="50%" stop-color="#177272" />
      <stop offset="100%" stop-color="#229999" />
    </linearGradient>

    <!-- Arrow Gradient: Warm Coral -->
    <linearGradient id="iconArrow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f28b63" />
      <stop offset="100%" stop-color="#ee6f40" />
    </linearGradient>

    <!-- SIMD Lanes Gradients -->
    <linearGradient id="iconLane0" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5eead4" />
      <stop offset="100%" stop-color="#2dd4bf" />
    </linearGradient>

    <linearGradient id="iconLane1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fed7aa" />
      <stop offset="100%" stop-color="#fb923c" />
    </linearGradient>

    <linearGradient id="iconLane2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fdba74" />
      <stop offset="100%" stop-color="#ee6f40" />
    </linearGradient>

    <linearGradient id="iconLane3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6ee7b7" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
  </defs>

  <!-- Squircle Base with Subtle Border (High visibility on both light and dark backgrounds) -->
  <rect x="4" y="4" width="120" height="120" rx="26" fill="url(#iconBg)" stroke="#283a50" stroke-width="1.5" />

  <!-- EMBLEM: Centered Option 3 Cyber Bow & 4-Lane Vector Arrow -->
  <g transform="translate(14, 14) scale(0.92)">
    <!-- Bowstring & Nock Region -->
    <path d="M 28,14 L 46,54 L 28,94" fill="none" stroke="#475569" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="46" cy="54" r="3.5" fill="#ee6f40" />

    <!-- Cyber Recurve Bow (Teal with Mint Accents) -->
    <path d="M 30,12 C 16,20 6,35 6,54 C 6,73 16,88 30,96 C 26,90 14,75 14,54 C 14,33 26,18 30,12 Z" 
          fill="url(#iconBow)" stroke="#5eead4" stroke-width="1.2" />
    
    <!-- Bow Limb Tips & Energy Accents -->
    <path d="M 30,12 L 36,9 L 33,17 Z" fill="#5eead4" />
    <path d="M 30,96 L 36,99 L 33,91 Z" fill="#5eead4" />
    <circle cx="14" cy="54" r="4.5" fill="#ee6f40" stroke="#5eead4" stroke-width="1.5" />

    <!-- 4 SIMD Vector Lanes (Data Streams firing forward) -->
    <!-- Lane 0 (Upper SIMD Track) -->
    <g>
      <line x1="40" y1="38" x2="78" y2="38" stroke="url(#iconLane0)" stroke-width="3.2" stroke-linecap="round" />
      <path d="M 78,38 L 88,48" stroke="#5eead4" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="3,2" />
    </g>

    <!-- Lane 1 (Mid-Upper Track) -->
    <g>
      <line x1="48" y1="49" x2="90" y2="49" stroke="url(#iconLane1)" stroke-width="3.5" stroke-linecap="round" />
    </g>

    <!-- Lane 2 (Mid-Lower Track) -->
    <g>
      <line x1="48" y1="59" x2="90" y2="59" stroke="url(#iconLane2)" stroke-width="3.5" stroke-linecap="round" />
    </g>

    <!-- Lane 3 (Lower SIMD Track) -->
    <g>
      <line x1="40" y1="70" x2="78" y2="70" stroke="url(#iconLane3)" stroke-width="3.2" stroke-linecap="round" />
      <path d="M 78,70 L 88,60" stroke="#34d399" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="3,2" />
    </g>

    <!-- Central Supersonic Vector Arrowhead -->
    <!-- Main Arrowhead Wings -->
    <polygon points="112,54 86,40 92,54 86,68" fill="url(#iconArrow)" stroke="#f28b63" stroke-width="1" />
    <!-- Core Diamond Pivot -->
    <polygon points="108,54 98,50 93,54 98,58" fill="#ffffff" opacity="0.95" />
    <!-- Pulse Ring -->
    <circle cx="93" cy="54" r="2" fill="#5eead4" />
  </g>
</svg>
