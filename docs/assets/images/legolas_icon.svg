<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Dark Squircle Background -->
  <rect x="4" y="4" width="120" height="120" rx="26" fill="#0f1722" stroke="#253549" stroke-width="2.5" />

  <!-- BOLD EMBLEM: Fully continuous bow & 4-lane arrow with ZERO gap -->
  <g transform="translate(6, 8)">
    <!-- Bowstring -->
    <path d="M 32,16 L 48,56 L 32,96" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="48" cy="56" r="4.5" fill="#ee6f40" />

    <!-- Cyber Recurve Bow -->
    <path d="M 34,12 C 18,22 8,38 8,56 C 8,74 18,90 34,100 C 28,92 16,76 16,56 C 16,36 28,20 34,12 Z" 
          fill="#177272" stroke="#5eead4" stroke-width="2" />
    
    <!-- Bow Tips & Grip Accent -->
    <polygon points="34,12 40,8 37,18" fill="#5eead4" />
    <polygon points="34,100 40,104 37,94" fill="#5eead4" />
    <circle cx="16" cy="56" r="4" fill="#ee6f40" />

    <!-- CONTINUOUS MAIN ARROW SHAFT (Bridges bowstring directly into arrowhead) -->
    <rect x="48" y="53.5" width="50" height="5" rx="2.5" fill="#ffffff" />

    <!-- 4 SIMD LANES (Spanning continuously from string to arrowhead wings) -->
    <!-- Lane 0 (Upper Track, Mint) -->
    <rect x="46" y="34" width="46" height="5" rx="2.5" fill="#5eead4" />
    <polygon points="90,34 98,42 95,44 87,36" fill="#5eead4" />

    <!-- Lane 1 (Mid-Upper Track, Peach Coral) -->
    <rect x="50" y="44" width="46" height="5" rx="2.5" fill="#fb923c" />

    <!-- Lane 2 (Mid-Lower Track, Warm Coral) -->
    <rect x="50" y="63" width="46" height="5" rx="2.5" fill="#ee6f40" />

    <!-- Lane 3 (Lower Track, Emerald) -->
    <rect x="46" y="73" width="46" height="5" rx="2.5" fill="#34d399" />
    <polygon points="90,78 98,70 95,68 87,76" fill="#34d399" />

    <!-- Supersonic Arrowhead (Firmly attached to shaft and lanes) -->
    <polygon points="118,56 88,38 96,56 88,74" fill="#ee6f40" stroke="#f28b63" stroke-width="2" />
    <polygon points="112,56 100,51 96,56 100,61" fill="#ffffff" />
    <circle cx="96" cy="56" r="2.5" fill="#5eead4" />
  </g>
</svg>
