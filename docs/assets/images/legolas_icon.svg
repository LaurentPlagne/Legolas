<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="iconBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#131d2b" />
      <stop offset="100%" stop-color="#0f1722" />
    </linearGradient>

    <linearGradient id="iconTeal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#28a3a3" />
      <stop offset="100%" stop-color="#177272" />
    </linearGradient>

    <linearGradient id="iconCoral" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f28b63" />
      <stop offset="100%" stop-color="#ee6f40" />
    </linearGradient>

    <linearGradient id="iconArrow" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#ee6f40" />
      <stop offset="60%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#5eead4" />
    </linearGradient>

    <filter id="iconGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Icon Rounded Squircle Container -->
  <rect width="128" height="128" rx="28" fill="url(#iconBg)" stroke="#253549" stroke-width="2.5" />

  <!-- Central Emblem -->
  <g transform="translate(18, 16)">
    <!-- Elven Bow Curve (Deep Teal) -->
    <path d="M 22,8 Q 2,48 22,88 Q 38,48 22,8" fill="none" stroke="url(#iconTeal)" stroke-width="5" stroke-linecap="round" />
    <!-- Bowstring -->
    <path d="M 22,8 L 52,48 L 22,88" fill="none" stroke="#334155" stroke-width="1.8" stroke-dasharray="3,3" />

    <!-- Isometric Interlocking Tensor Cubes (Lego / Tensor Packing) -->
    <!-- Cube 1 (Base, Deep Teal) -->
    <g transform="translate(36, 44)">
      <polygon points="16,0 32,8 16,16 0,8" fill="#28a3a3" />
      <polygon points="0,8 16,16 16,32 0,24" fill="#177272" />
      <polygon points="16,16 32,8 32,24 16,32" fill="#0e4b4b" />
    </g>

    <!-- Cube 2 (Top Left, Warm Coral) -->
    <g transform="translate(20, 28)">
      <polygon points="16,0 32,8 16,16 0,8" fill="#f28b63" />
      <polygon points="0,8 16,16 16,32 0,24" fill="#ee6f40" />
      <polygon points="16,16 32,8 32,24 16,32" fill="#c2410c" />
    </g>

    <!-- Cube 3 (Right, Mint Accent) -->
    <g transform="translate(52, 28)">
      <polygon points="16,0 32,8 16,16 0,8" fill="#5eead4" />
      <polygon points="0,8 16,16 16,32 0,24" fill="#14b8a6" />
      <polygon points="16,16 32,8 32,24 16,32" fill="#0f766e" />
    </g>

    <!-- SIMD 4-Lane Vector Stream -->
    <line x1="6" y1="88" x2="28" y2="66" stroke="#ee6f40" stroke-width="2" opacity="0.6" />
    <line x1="12" y1="94" x2="34" y2="72" stroke="#f28b63" stroke-width="2" opacity="0.8" />
    <line x1="18" y1="100" x2="40" y2="78" stroke="#5eead4" stroke-width="2" opacity="0.9" />

    <!-- Main Piercing Vector Arrow -->
    <line x1="16" y1="78" x2="78" y2="16" stroke="url(#iconArrow)" stroke-width="5" stroke-linecap="round" filter="url(#iconGlow)" />
    <!-- Arrow Head -->
    <polygon points="86,8 65,16 78,29" fill="#5eead4" filter="url(#iconGlow)" />
  </g>
</svg>
