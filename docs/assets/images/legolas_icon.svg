<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Dark Squircle Container (Universal contrast for favicon and navbar) -->
  <rect x="4" y="4" width="120" height="120" rx="26" fill="#0f1722" stroke="#253549" stroke-width="2.5" />

  <!-- BOLD EMBLEM: Scaled and centered for high visibility at 16px-32px -->
  <g transform="translate(8, 8)">
    <!-- Bowstring -->
    <path d="M 30,16 L 48,56 L 30,96" fill="none" stroke="#64748b" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="48" cy="56" r="4.5" fill="#ee6f40" />

    <!-- Cyber Bow Body (Thick, bold, high-contrast) -->
    <path d="M 32,12 C 16,22 6,38 6,56 C 6,74 16,90 32,100 C 26,92 14,76 14,56 C 14,36 26,20 32,12 Z" 
          fill="#177272" stroke="#5eead4" stroke-width="2" />
    
    <!-- Bow Tips -->
    <polygon points="32,12 38,8 35,18" fill="#5eead4" />
    <polygon points="32,100 38,104 35,94" fill="#5eead4" />

    <!-- 4 BOLD SIMD Lanes (Solid rectangles, ultra-crisp at any resolution) -->
    <rect x="44" y="34" width="38" height="5.5" rx="2.5" fill="#5eead4" />
    <rect x="52" y="46" width="40" height="6" rx="3" fill="#fb923c" />
    <rect x="52" y="58" width="40" height="6" rx="3" fill="#ee6f40" />
    <rect x="44" y="70" width="38" height="5.5" rx="2.5" fill="#34d399" />

    <!-- Prominent Supersonic Arrowhead -->
    <polygon points="116,56 86,38 94,56 86,74" fill="#ee6f40" stroke="#f28b63" stroke-width="2" />
    <polygon points="110,56 98,51 94,56 98,61" fill="#ffffff" />
    <circle cx="94" cy="56" r="2.5" fill="#5eead4" />
  </g>
</svg>
