<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 490" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap');
      
      text { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
      .mono { font-family: 'JetBrains Mono', monospace; }

      /* Animation keyframes */
      @keyframes standardScene {
        0%, 35% { opacity: 1; transform: translateY(0); }
        40%, 100% { opacity: 0; transform: translateY(-10px); pointer-events: none; }
      }

      @keyframes dliScene {
        0%, 38% { opacity: 0; transform: translateY(10px); }
        44%, 94% { opacity: 1; transform: translateY(0); }
        98%, 100% { opacity: 0; transform: translateY(-10px); }
      }

      @keyframes pulseGather {
        0%, 100% { stroke-dashoffset: 0; opacity: 0.8; }
        50% { stroke-dashoffset: 20; opacity: 1; }
      }

      @keyframes simdLaser {
        0%, 46% { transform: translateX(0); opacity: 0; }
        50% { opacity: 1; transform: translateX(0); }
        65% { transform: translateX(190px); }
        80% { transform: translateX(380px); }
        92% { opacity: 1; transform: translateX(380px); }
        95%, 100% { opacity: 0; }
      }

      @keyframes highlightPacket {
        0%, 48% { opacity: 0.3; }
        50%, 63% { opacity: 1; filter: drop-shadow(0 0 8px rgba(56, 189, 248, 0.6)); }
        65%, 78% { opacity: 0.3; }
        80%, 93% { opacity: 0.3; }
      }

      @keyframes highlightPacket2 {
        0%, 63% { opacity: 0.3; }
        65%, 78% { opacity: 1; filter: drop-shadow(0 0 8px rgba(52, 211, 153, 0.6)); }
        80%, 100% { opacity: 0.3; }
      }

      @keyframes highlightPacket3 {
        0%, 78% { opacity: 0.3; }
        80%, 93% { opacity: 1; filter: drop-shadow(0 0 8px rgba(251, 191, 36, 0.6)); }
        95%, 100% { opacity: 0.3; }
      }

      .scene-std { animation: standardScene 11s infinite ease-in-out; }
      .scene-dli { animation: dliScene 11s infinite ease-in-out; }
      .laser { animation: simdLaser 11s infinite cubic-bezier(0.4, 0, 0.2, 1); }
      .pack0 { animation: highlightPacket 11s infinite; }
      .pack1 { animation: highlightPacket2 11s infinite; }
      .pack2 { animation: highlightPacket3 11s infinite; }
    </style>

    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>

    <linearGradient id="simdGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <linearGradient id="laserGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <!-- Box Shadows & Glows -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Container Box -->
  <rect width="920" height="490" rx="16" fill="url(#bgGrad)" stroke="#1f2937" stroke-width="2" />

  <!-- Top Title Bar -->
  <g transform="translate(30, 32)">
    <rect width="860" height="46" rx="8" fill="#1e293b" fill-opacity="0.6" stroke="#334155" stroke-width="1" />
    <circle cx="24" cy="23" r="6" fill="#ef4444" />
    <circle cx="42" cy="23" r="6" fill="#f59e0b" />
    <circle cx="60" cy="23" r="6" fill="#10b981" />
    <text x="85" y="28" fill="#f8fafc" font-size="14" font-weight="700" letter-spacing="0.5">
      LEGOLAS++ ARCHITECTURE — DATA LAYOUT INTERLEAVING (DLI) ANIMATION
    </text>
    <rect x="730" y="11" width="115" height="24" rx="12" fill="#3b82f6" fill-opacity="0.2" stroke="#3b82f6" stroke-width="1" />
    <text x="787" y="27" fill="#60a5fa" font-size="11" font-weight="700" text-anchor="middle">LIVE SCHEME</text>
  </g>

  <!-- ================================================================= -->
  <!-- SCENE 1: Standard Non-Interleaved Layout (0s - 4s)               -->
  <!-- ================================================================= -->
  <g class="scene-std" transform="translate(30, 95)">
    <!-- Stage Header -->
    <rect width="860" height="40" rx="8" fill="#ef4444" fill-opacity="0.1" stroke="#ef4444" stroke-width="1" />
    <text x="20" y="25" fill="#fca5a5" font-size="14" font-weight="700">
      ⚠️ Standard Layout: Non-Contiguous Memory Slices (Strided Gather Bottleneck)
    </text>
    <text x="840" y="25" fill="#f87171" font-size="12" font-weight="600" text-anchor="end" class="mono">
      Step i=1 separated by stride N
    </text>

    <!-- 4 Systems Arrays -->
    <!-- System 0 -->
    <g transform="translate(0, 55)">
      <rect width="130" height="42" rx="6" fill="#0369a1" fill-opacity="0.25" stroke="#0284c7" stroke-width="1.5" />
      <text x="15" y="26" fill="#38bdf8" font-size="12" font-weight="700">System 0 (s=0)</text>
      <g transform="translate(145, 0)">
        <rect x="0" width="70" height="42" rx="4" fill="#1e293b" stroke="#334155" /><text x="35" y="26" fill="#94a3b8" font-size="12" text-anchor="middle" class="mono">X₀[0]</text>
        <!-- Highlighted target i=1 -->
        <rect x="78" width="76" height="42" rx="4" fill="#0284c7" stroke="#38bdf8" stroke-width="2" filter="url(#glow)"/><text x="116" y="26" fill="#ffffff" font-size="13" font-weight="700" text-anchor="middle" class="mono">X₀[1]</text>
        <rect x="162" width="70" height="42" rx="4" fill="#1e293b" stroke="#334155" /><text x="197" y="26" fill="#94a3b8" font-size="12" text-anchor="middle" class="mono">X₀[2]</text>
        <rect x="240" width="70" height="42" rx="4" fill="#1e293b" stroke="#334155" /><text x="275" y="26" fill="#94a3b8" font-size="12" text-anchor="middle" class="mono">X₀[3]</text>
        <text x="330" y="26" fill="#64748b" font-size="14" class="mono">...</text>
        <rect x="365" width="85" height="42" rx="4" fill="#1e293b" stroke="#334155" /><text x="407" y="26" fill="#94a3b8" font-size="12" text-anchor="middle" class="mono">X₀[N-1]</text>
      </g>
    </g>

    <!-- System 1 -->
    <g transform="translate(0, 105)">
      <rect width="130" height="42" rx="6" fill="#047857" fill-opacity="0.25" stroke="#059669" stroke-width="1.5" />
      <text x="15" y="26" fill="#34d399" font-size="12" font-weight="700">System 1 (s=1)</text>
      <g transform="translate(145, 0)">
        <rect x="0" width="70" height="42" rx="4" fill="#1e293b" stroke="#334155" /><text x="35" y="26" fill="#94a3b8" font-size="12" text-anchor="middle" class="mono">X₁[0]</text>
        <!-- Highlighted target i=1 -->
        <rect x="78" width="76" height="42" rx="4" fill="#059669" stroke="#34d399" stroke-width="2" filter="url(#glow)"/><text x="116" y="26" fill="#ffffff" font-size="13" font-weight="700" text-anchor="middle" class="mono">X₁[1]</text>
        <rect x="162" width="70" height="42" rx="4" fill="#1e293b" stroke="#334155" /><text x="197" y="26" fill="#94a3b8" font-size="12" text-anchor="middle" class="mono">X₁[2]</text>
        <rect x="240" width="70" height="42" rx="4" fill="#1e293b" stroke="#334155" /><text x="275" y="26" fill="#94a3b8" font-size="12" text-anchor="middle" class="mono">X₁[3]</text>
        <text x="330" y="26" fill="#64748b" font-size="14" class="mono">...</text>
        <rect x="365" width="85" height="42" rx="4" fill="#1e293b" stroke="#334155" /><text x="407" y="26" fill="#94a3b8" font-size="12" text-anchor="middle" class="mono">X₁[N-1]</text>
      </g>
    </g>

    <!-- System 2 -->
    <g transform="translate(0, 155)">
      <rect width="130" height="42" rx="6" fill="#b45309" fill-opacity="0.25" stroke="#d97706" stroke-width="1.5" />
      <text x="15" y="26" fill="#fbbf24" font-size="12" font-weight="700">System 2 (s=2)</text>
      <g transform="translate(145, 0)">
        <rect x="0" width="70" height="42" rx="4" fill="#1e293b" stroke="#334155" /><text x="35" y="26" fill="#94a3b8" font-size="12" text-anchor="middle" class="mono">X₂[0]</text>
        <!-- Highlighted target i=1 -->
        <rect x="78" width="76" height="42" rx="4" fill="#d97706" stroke="#fbbf24" stroke-width="2" filter="url(#glow)"/><text x="116" y="26" fill="#ffffff" font-size="13" font-weight="700" text-anchor="middle" class="mono">X₂[1]</text>
        <rect x="162" width="70" height="42" rx="4" fill="#1e293b" stroke="#334155" /><text x="197" y="26" fill="#94a3b8" font-size="12" text-anchor="middle" class="mono">X₂[2]</text>
        <rect x="240" width="70" height="42" rx="4" fill="#1e293b" stroke="#334155" /><text x="275" y="26" fill="#94a3b8" font-size="12" text-anchor="middle" class="mono">X₂[3]</text>
        <text x="330" y="26" fill="#64748b" font-size="14" class="mono">...</text>
        <rect x="365" width="85" height="42" rx="4" fill="#1e293b" stroke="#334155" /><text x="407" y="26" fill="#94a3b8" font-size="12" text-anchor="middle" class="mono">X₂[N-1]</text>
      </g>
    </g>

    <!-- System 3 -->
    <g transform="translate(0, 205)">
      <rect width="130" height="42" rx="6" fill="#6b21a8" fill-opacity="0.25" stroke="#9333ea" stroke-width="1.5" />
      <text x="15" y="26" fill="#c084fc" font-size="12" font-weight="700">System 3 (s=3)</text>
      <g transform="translate(145, 0)">
        <rect x="0" width="70" height="42" rx="4" fill="#1e293b" stroke="#334155" /><text x="35" y="26" fill="#94a3b8" font-size="12" text-anchor="middle" class="mono">X₃[0]</text>
        <!-- Highlighted target i=1 -->
        <rect x="78" width="76" height="42" rx="4" fill="#9333ea" stroke="#c084fc" stroke-width="2" filter="url(#glow)"/><text x="116" y="26" fill="#ffffff" font-size="13" font-weight="700" text-anchor="middle" class="mono">X₃[1]</text>
        <rect x="162" width="70" height="42" rx="4" fill="#1e293b" stroke="#334155" /><text x="197" y="26" fill="#94a3b8" font-size="12" text-anchor="middle" class="mono">X₃[2]</text>
        <rect x="240" width="70" height="42" rx="4" fill="#1e293b" stroke="#334155" /><text x="275" y="26" fill="#94a3b8" font-size="12" text-anchor="middle" class="mono">X₃[3]</text>
        <text x="330" y="26" fill="#64748b" font-size="14" class="mono">...</text>
        <rect x="365" width="85" height="42" rx="4" fill="#1e293b" stroke="#334155" /><text x="407" y="26" fill="#94a3b8" font-size="12" text-anchor="middle" class="mono">X₃[N-1]</text>
      </g>
    </g>

    <!-- Red Gather Stride Bracket -->
    <path d="M 610,75 L 635,75 L 635,150 L 655,150 L 635,150 L 635,225 L 610,225" fill="none" stroke="#ef4444" stroke-width="2.5" stroke-dasharray="6,4" />
    <rect x="670" y="115" width="180" height="70" rx="8" fill="#1e1b4b" fill-opacity="0.8" stroke="#ef4444" stroke-width="1.5" />
    <text x="760" y="142" fill="#f87171" font-size="13" font-weight="700" text-anchor="middle">❌ Stride = N</text>
    <text x="760" y="162" fill="#cbd5e1" font-size="11" text-anchor="middle">Non-contiguous gather</text>
    <text x="760" y="177" fill="#94a3b8" font-size="10" text-anchor="middle">SIMD vector load fails</text>
  </g>

  <!-- ================================================================= -->
  <!-- SCENE 2: Legolas Data Layout Interleaving (4s - 11s)              -->
  <!-- ================================================================= -->
  <g class="scene-dli" transform="translate(30, 95)">
    <!-- Stage Header -->
    <rect width="860" height="40" rx="8" fill="#10b981" fill-opacity="0.1" stroke="#10b981" stroke-width="1" />
    <text x="20" y="25" fill="#6ee7b7" font-size="14" font-weight="700">
      ⚡ Legolas++ Interleaved Memory Stream: Contiguous Vector Packets in Hardware RAM
    </text>
    <text x="840" y="25" fill="#34d399" font-size="12" font-weight="700" text-anchor="end" class="mono">
      Pack Size P=4 (NEON / AVX2)
    </text>

    <!-- Continuous Interleaved Physical Stream -->
    <g transform="translate(0, 60)">
      <rect width="860" height="135" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
      <text x="20" y="30" fill="#94a3b8" font-size="12" font-weight="600">Physical Address Space (1D Contiguous RAM):</text>

      <!-- Packet 0 (i=0) -->
      <g class="pack0" transform="translate(20, 45)">
        <rect width="176" height="72" rx="6" fill="#1e293b" stroke="#0284c7" stroke-width="1.5" />
        <text x="88" y="22" fill="#38bdf8" font-size="11" font-weight="700" text-anchor="middle">Vector Packet i=0</text>
        <g transform="translate(8, 30)">
          <rect x="0" width="36" height="32" rx="3" fill="#0284c7" /><text x="18" y="21" fill="#fff" font-size="11" font-weight="700" text-anchor="middle" class="mono">X₀₀</text>
          <rect x="40" width="36" height="32" rx="3" fill="#059669" /><text x="58" y="21" fill="#fff" font-size="11" font-weight="700" text-anchor="middle" class="mono">X₁₀</text>
          <rect x="80" width="36" height="32" rx="3" fill="#d97706" /><text x="98" y="21" fill="#fff" font-size="11" font-weight="700" text-anchor="middle" class="mono">X₂₀</text>
          <rect x="120" width="36" height="32" rx="3" fill="#9333ea" /><text x="138" y="21" fill="#fff" font-size="11" font-weight="700" text-anchor="middle" class="mono">X₃₀</text>
        </g>
      </g>

      <!-- Packet 1 (i=1) -->
      <g class="pack1" transform="translate(210, 45)">
        <rect width="176" height="72" rx="6" fill="#1e293b" stroke="#059669" stroke-width="1.5" />
        <text x="88" y="22" fill="#34d399" font-size="11" font-weight="700" text-anchor="middle">Vector Packet i=1</text>
        <g transform="translate(8, 30)">
          <rect x="0" width="36" height="32" rx="3" fill="#0284c7" /><text x="18" y="21" fill="#fff" font-size="11" font-weight="700" text-anchor="middle" class="mono">X₀₁</text>
          <rect x="40" width="36" height="32" rx="3" fill="#059669" /><text x="58" y="21" fill="#fff" font-size="11" font-weight="700" text-anchor="middle" class="mono">X₁₁</text>
          <rect x="80" width="36" height="32" rx="3" fill="#d97706" /><text x="98" y="21" fill="#fff" font-size="11" font-weight="700" text-anchor="middle" class="mono">X₂₁</text>
          <rect x="120" width="36" height="32" rx="3" fill="#9333ea" /><text x="138" y="21" fill="#fff" font-size="11" font-weight="700" text-anchor="middle" class="mono">X₃₁</text>
        </g>
      </g>

      <!-- Packet 2 (i=2) -->
      <g class="pack2" transform="translate(400, 45)">
        <rect width="176" height="72" rx="6" fill="#1e293b" stroke="#d97706" stroke-width="1.5" />
        <text x="88" y="22" fill="#fbbf24" font-size="11" font-weight="700" text-anchor="middle">Vector Packet i=2</text>
        <g transform="translate(8, 30)">
          <rect x="0" width="36" height="32" rx="3" fill="#0284c7" /><text x="18" y="21" fill="#fff" font-size="11" font-weight="700" text-anchor="middle" class="mono">X₀₂</text>
          <rect x="40" width="36" height="32" rx="3" fill="#059669" /><text x="58" y="21" fill="#fff" font-size="11" font-weight="700" text-anchor="middle" class="mono">X₁₂</text>
          <rect x="80" width="36" height="32" rx="3" fill="#d97706" /><text x="98" y="21" fill="#fff" font-size="11" font-weight="700" text-anchor="middle" class="mono">X₂₂</text>
          <rect x="120" width="36" height="32" rx="3" fill="#9333ea" /><text x="138" y="21" fill="#fff" font-size="11" font-weight="700" text-anchor="middle" class="mono">X₃₂</text>
        </g>
      </g>

      <!-- Ellipsis -->
      <text x="595" y="85" fill="#64748b" font-size="24" font-weight="700" class="mono">...</text>

      <!-- Packet N-1 -->
      <g transform="translate(645, 45)">
        <rect width="195" height="72" rx="6" fill="#1e293b" stroke="#64748b" stroke-width="1" />
        <text x="97" y="22" fill="#94a3b8" font-size="11" font-weight="700" text-anchor="middle">Vector Packet i=N-1</text>
        <g transform="translate(10, 30)">
          <rect x="0" width="40" height="32" rx="3" fill="#0284c7" opacity="0.6"/><text x="20" y="21" fill="#fff" font-size="10" text-anchor="middle" class="mono">X₀,N₋₁</text>
          <rect x="44" width="40" height="32" rx="3" fill="#059669" opacity="0.6"/><text x="64" y="21" fill="#fff" font-size="10" text-anchor="middle" class="mono">X₁,N₋₁</text>
          <rect x="88" width="40" height="32" rx="3" fill="#d97706" opacity="0.6"/><text x="108" y="21" fill="#fff" font-size="10" text-anchor="middle" class="mono">X₂,N₋₁</text>
          <rect x="132" width="40" height="32" rx="3" fill="#9333ea" opacity="0.6"/><text x="152" y="21" fill="#fff" font-size="10" text-anchor="middle" class="mono">X₃,N₋₁</text>
        </g>
      </g>
    </g>

    <!-- Animated Hardware SIMD Register Loader -->
    <g class="laser" transform="translate(20, 215)">
      <rect width="176" height="50" rx="8" fill="url(#simdGrad)" stroke="#a855f7" stroke-width="2" filter="url(#glow)" />
      <text x="88" y="24" fill="#ffffff" font-size="12" font-weight="800" text-anchor="middle">
        128-bit / 256-bit SIMD REGISTER
      </text>
      <text x="88" y="40" fill="#e0e7ff" font-size="10" font-weight="600" text-anchor="middle" class="mono">
        1 Single Vector Load (ldr q / vmovaps)
      </text>
      <!-- Pointer arrow -->
      <polygon points="88,0 80,-12 96,-12" fill="#a855f7" />
    </g>

    <!-- Benefit Badges Bottom -->
    <g transform="translate(0, 280)">
      <rect width="270" height="42" rx="8" fill="#1e293b" stroke="#334155" />
      <text x="20" y="26" fill="#38bdf8" font-size="12" font-weight="700">✓ 100% Contiguous Streaming</text>

      <rect x="290" width="280" height="42" rx="8" fill="#1e293b" stroke="#334155" />
      <text x="310" y="26" fill="#34d399" font-size="12" font-weight="700">✓ Zero Gather / Zero Scatter</text>

      <rect x="590" width="270" height="42" rx="8" fill="#1e293b" stroke="#334155" />
      <text x="610" y="26" fill="#a855f7" font-size="12" font-weight="700">✓ Full Hardware Vector Line-Rate</text>
    </g>
  </g>

  <!-- Bottom Legend -->
  <g transform="translate(30, 452)">
    <circle cx="10" cy="8" r="5" fill="#0284c7" /><text x="22" y="12" fill="#94a3b8" font-size="11">System 0</text>
    <circle cx="120" cy="8" r="5" fill="#059669" /><text x="132" y="12" fill="#94a3b8" font-size="11">System 1</text>
    <circle cx="230" cy="8" r="5" fill="#d97706" /><text x="242" y="12" fill="#94a3b8" font-size="11">System 2</text>
    <circle cx="340" cy="8" r="5" fill="#9333ea" /><text x="352" y="12" fill="#94a3b8" font-size="11">System 3</text>
    <text x="860" y="12" fill="#64748b" font-size="11" text-anchor="end">Loop Period: 11 seconds · Pure CSS Vector Animation</text>
  </g>
</svg>
