name: CI (Linux, macOS, Windows)

on:
  push:
    branches:
      - master
      - main
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - 'mkdocs.yml'
      - '.github/workflows/docs.yml'
  pull_request:
    branches:
      - master
      - main
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - 'mkdocs.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "Ubuntu GCC 14 | Linux x86_64 (Zero-Dep)"
            os: ubuntu-latest
          - name: "macOS Apple Silicon Clang | ARM64 NEON (Zero-Dep)"
            os: macos-14
          - name: "Windows MSVC | Win64 AVX2 (Zero-Dep)"
            os: windows-latest

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure CMake
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build all targets
        run: |
          cmake --build build --config Release --parallel 2>&1 | tee build.log || {
            echo "### ❌ Build Failure Log (${{ matrix.name }})" >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            tail -n 120 build.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          }

      - name: Run CTest test suite
        run: |
          ctest --test-dir build --build-config Release --output-on-failure 2>&1 | tee ctest.log || {
            echo "### ❌ CTest Failure Log (${{ matrix.name }})" >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            cat ctest.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          }

      - name: Run Verification Benchmarks
        run: |
          echo "=== 1. AI MobileNet Depthwise 2D Convolution ==="
          find build -name "DepthwiseConv*" -type f -exec {} \; || true
          echo "=== 2. Real-Time 64-Track Audio IIR Biquad ==="
          find build -name "AudioBiquad*" -type f -exec {} \; || true
          echo "=== 3. Tridiagonal Thomas Example ==="
          find build -name "MultiThomasExample*" -type f -exec {} \; || true
          echo "=== 4. Fast Thomas (Nx=64) ==="
          find build -name "MultiThomas*" -type f -not -name "*Example*" -exec {} 64 \; || true



