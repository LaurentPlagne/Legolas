name: CI Matrix (Multi-OS & Backends)

on:
  push:
    branches:
      - master
      - main
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - 'mkdocs.yml'
      - '.github/workflows/docs.yml'
  pull_request:
    branches:
      - master
      - main
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - 'mkdocs.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ${{ matrix.os }} | TBB=${{ matrix.use_tbb }} | Eigen=${{ matrix.use_eigen }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
        use_tbb: [ON, OFF]
        use_eigen: [ON, OFF]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libtbb-dev libeigen3-dev

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install ninja tbb eigen

      - name: Configure CMake
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DUSE_TBB=${{ matrix.use_tbb }} \
            -DUSE_EIGEN=${{ matrix.use_eigen }}

      - name: Build all targets
        run: |
          cmake --build build --parallel

      - name: Run CTest test suite
        run: |
          ctest --test-dir build --output-on-failure

      - name: Run Verification Benchmarks
        run: |
          echo "=== 1. AI MobileNet Depthwise 2D Convolution ==="
          ./build/examples/DepthwiseConv
          echo "=== 2. Real-Time 64-Track Audio IIR Biquad ==="
          ./build/examples/AudioBiquad
          echo "=== 3. Tridiagonal Thomas Benchmark (Nx=64) ==="
          ./build/tst/MultiThomas/MultiThomas 64 1
