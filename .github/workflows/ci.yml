name: CI (Linux, macOS, Windows)

on:
  push:
    branches:
      - master
      - main
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - 'mkdocs.yml'
      - '.github/workflows/docs.yml'
  pull_request:
    branches:
      - master
      - main
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - 'mkdocs.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "Ubuntu GCC 14 | Linux x86_64 (Zero-Dep)"
            os: ubuntu-latest
          - name: "macOS Apple Silicon Clang | ARM64 NEON (Zero-Dep)"
            os: macos-14
          - name: "Windows MSVC | Win64 AVX2 (Zero-Dep)"
            os: windows-latest

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build build-essential

      - name: Configure CMake
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build all targets
        run: |
          cmake --build build --config Release --parallel || {
            echo "::error::Parallel build failed, re-running verbose to show compiler error:"
            cmake --build build --config Release -v
            exit 1
          }

      - name: Run CTest test suite
        run: |
          ctest --test-dir build --build-config Release --output-on-failure

      - name: Run Verification Benchmarks
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            echo "=== 1. AI MobileNet Depthwise 2D Convolution ==="
            find build -name "DepthwiseConv.exe" -exec {} \; || true
            echo "=== 2. Real-Time 64-Track Audio IIR Biquad ==="
            find build -name "AudioBiquad.exe" -exec {} \; || true
            echo "=== 3. Tridiagonal Thomas Example ==="
            find build -name "MultiThomasExample.exe" -exec {} \; || true
            echo "=== 4. Fast Thomas (Nx=64) ==="
            find build -name "MultiThomas.exe" -exec {} 64 \; || true
          else
            echo "=== 1. AI MobileNet Depthwise 2D Convolution ==="
            ./build/examples/DepthwiseConv || true
            echo "=== 2. Real-Time 64-Track Audio IIR Biquad ==="
            ./build/examples/AudioBiquad || true
            echo "=== 3. Tridiagonal Thomas Example ==="
            ./build/tst/MultiThomasExample/MultiThomasExample || true
            echo "=== 4. Fast Thomas (Nx=64) ==="
            ./build/tst/MultiThomas/MultiThomas 64 || true
          fi




